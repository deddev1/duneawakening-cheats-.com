name = "dune-awakening-cheats-net"
compatibility_date = "2026-01-01"
main = "worker.js"

# Cloudflare Workers Builds runs only `npx wrangler deploy` by default.
# This build step creates ./dist before static assets are uploaded.
[build]
command = "node scripts/cloudflare-build.mjs"

# Static assets (HTML, sitemaps, robots.txt) are served first; the worker handles
# redirects and HTML security headers only when needed.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = false
not_found_handling = "404-page"
